# Versions for the whole toolkit build. This was brasssync/gradle.properties when brassui lived in
# that monorepo; the NeoForge/Minecraft half of it came along because the toolkit compiles against
# mapped Minecraft (UniversalCraft's API exposes a few net.minecraft types) and the mod half is a real
# NeoForge mod.

# The platform the toolkit is built for: NeoForge 21.1.x / MC 1.21.1 / Java 21.
minecraft_version=1.21.1
minecraft_version_range=[1.21,1.21.3)
neo_version=21.1.217
neo_version_range=[21.1.128,)
loader_version_range=[4,)
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

# Essential's Elementa/UniversalCraft, bundled (jar-in-jar) by the mod.
# UniversalCraft has no 1.21.1 build; MC 1.21 is binary-compatible, so we use the 1.21-neoforge one.
kotlin_version=2.0.21
elementa_version=760
universalcraft_version=505
# Kotlin For Forge: provides the Kotlin runtime on NeoForge and (crucially) the FML module wiring that
# makes all kotlin.* packages readable to mods — without it, kotlin.enums.EnumEntriesKt (the backing of
# every enum's `entries`) isn't found at runtime. 5.x is the MC 1.21/1.21.1 line.
kff_version=5.12.0

# MongoDB's pure-JVM BSON library: the binary wire format for brassnet (action inputs, results and
# server state) and the node editor's native save/load format. Pure Java, zero native code, and its
# only POM dependency (slf4j-api) is optional, so it bundles cleanly jar-in-jar and mirrors to
# maven.opnsoc.org like Elementa/UniversalCraft. Bump the mirror script too.
bson_version=5.6.5

# LWJGL, for the key-chord tests only. Minecraft 1.21 ships 3.3.3; the version matters little here
# since only the GLFW key-code constants and glfwGetKeyName are used, but pinning it keeps the test
# classpath from drifting away from what the game actually runs.
lwjgl_version=3.3.3

# Published coordinates. See the `publishing` block in build.gradle.
group=net.swzo.brass
version=2.2.0
