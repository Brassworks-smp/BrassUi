// Shared plugin versions, declared once for the whole build.
//
// A subproject that writes `plugins { id 'x' version 'y' }` gets its **own classloader** for that
// plugin — Gradle says so explicitly, and warns that this happens "even if the versions are equal".
// Three subprojects each declared moddev 2.0.74, so three separate copies of the plugin class were
// loaded, and each one applied org.jetbrains.gradle.ext to the root project. The first registered the
// `settings` extension; the second was a different Class from a different loader, so Gradle did not
// recognise it as already applied and tried to register `settings` again:
//
//     Cannot add extension with name 'settings', as there is an extension already registered
//
// That only surfaced in IntelliJ, because ModDevGradle applies the IDEA plugin during a sync and not
// during a plain CLI build — which is why `./gradlew build` was green while project import failed.
//
// Declaring the versions here (and nowhere else) puts one copy of each plugin in the root
// classloader, shared by every subproject. Subprojects apply them without a version.
plugins {
    id 'org.jetbrains.kotlin.jvm' version '2.0.21' apply false
    id 'net.neoforged.moddev' version '2.0.74' apply false
    id 'com.gradleup.shadow' version '8.3.6' apply false
    // Modrinth / CurseForge / GitHub release publishing (`:mod:publishMods`). Pinned to 1.x: 2.x
    // requires Gradle 9 and this build is on 8.12.1.
    id 'me.modmuss50.mod-publish-plugin' version '1.1.0' apply false
}

subprojects {
    apply plugin: 'java-library'

    group = rootProject.group
    version = rootProject.version

    java {
        toolchain.languageVersion = JavaLanguageVersion.of(21)
    }

    repositories {
        mavenCentral()
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release.set(21)
    }
}

// ---- publishing ---------------------------------------------------------------------------------
//
// Only the two artifacts another project would ever depend on are published:
//
//   • `brassui-core` — the toolkit library, for a mod that wants the widgets and is doing its own
//     Elementa/UniversalCraft bundling.
//   • `brassui`      — the self-contained NeoForge mod, for a mod that just wants working UI and
//     would rather jar-in-jar one thing than solve the module-layer problem itself (see mod/build.gradle).
//
// `:demo` and `:desktop` are development surfaces, not something to depend on, so they stay unpublished.
//
// Brassworks Maven is public for consumers and key-protected for publishers. The URL is overridable so
// the exact same Gradle publishing flow can be verified against a local repository before a release.
//
// Publishing credentials come from the gitignored `.env` at the repo root, so a release is one
// command (`./gradlew publish`) with nothing to source or re-enter. Resolving any value follows the
// same precedence: `-P` project property > real environment variable > `.env` file > default.
def dotEnv = { String name ->
    def f = rootProject.file('.env')
    if (!f.isFile()) return null
    for (line in f.readLines('UTF-8')) {
        def t = line.trim()
        if (t.startsWith('export ')) t = t.substring('export '.length()).trim()
        if (t.isEmpty() || t.startsWith('#') || !t.contains('=')) continue
        def eq = t.indexOf('=')
        if (t.substring(0, eq).trim() != name) continue
        def v = t.substring(eq + 1).trim()
        if (v.length() >= 2 && v.startsWith('"') && v.endsWith('"')) {
            v = v.substring(1, v.length() - 1)
        }
        return v
    }
    null
}
configure([project(':core'), project(':mod')]) {
    apply plugin: 'maven-publish'

    java {
        withSourcesJar()
    }

    publishing {
        publications {
            maven(MavenPublication) {
                from components.java
                artifactId = project.name == 'core' ? 'brassui-core' : 'brassui'

                // The mod jar is self-contained at runtime: core + demo classes are folded in and
                // Elementa/UniversalCraft ride as jar-in-jar. The POM deliberately carries Elementa +
                // UniversalCraft as compile-scope dependencies (so consumers compile against them
                // without adding anything). KFF is a required *mod* (neoforge.mods.toml), not a
                // library: Kotlin consumers already declare it themselves and it lives on a repo we
                // shouldn't force them to add, so it is kept out of the POM. `brassui-core` keeps its
                // (honest) deps.
                if (project.name == 'mod') {
                    pom.withXml {
                        def deps = asNode().dependencies?.get(0)
                        if (deps != null) {
                            deps.children().removeAll {
                                it.name().localPart == 'dependency' &&
                                    it.groupId.text() == 'thedarkcolour'
                            }
                        }
                    }
                }

                pom {
                    name = artifactId
                    description = project.name == 'core'
                        ? 'Elementa widget toolkit for Minecraft in the Brassworks launcher idiom.'
                        : 'brassui as a self-contained NeoForge mod, Elementa/UniversalCraft included.'
                    url = 'https://github.com/Brassworks-smp/BrassUi'
                    licenses {
                        license {
                            // Source-available, not open source: noncommercial use is granted, commercial
                            // use by anyone else is not. See LICENSE.md and the README's licence note.
                            name = 'PolyForm Noncommercial License 1.0.0'
                            url = 'https://polyformproject.org/licenses/noncommercial/1.0.0'
                        }
                    }
                    developers {
                        developer {
                            id = 'swzo'
                            name = 'swzo'
                        }
                    }
                    scm {
                        url = 'https://github.com/Brassworks-smp/BrassUi'
                        connection = 'scm:git:https://github.com/Brassworks-smp/BrassUi.git'
                    }
                }
            }
        }

        repositories {
            maven {
                name = 'BrassworksMaven'
                url = uri(
                    project.findProperty('brassworks.maven.url')
                        ?: System.getenv('BRASSWORKS_MAVEN_URL')
                        ?: dotEnv('BRASSWORKS_MAVEN_URL')
                        ?: 'https://maven.opnsoc.org/releases'
                )
                // Local verification uses HTTP; the production default above is always HTTPS.
                allowInsecureProtocol = url.scheme == 'http'
                credentials {
                    username = project.findProperty('brassworks.maven.user')
                        ?: System.getenv('BRASSWORKS_MAVEN_USER')
                        ?: dotEnv('BRASSWORKS_MAVEN_USER')
                        ?: 'brassui'
                    password = project.findProperty('brassworks.maven.key')
                        ?: System.getenv('BRASSWORKS_MAVEN_KEY')
                        ?: dotEnv('BRASSWORKS_MAVEN_KEY')
                }
                authentication { basic(BasicAuthentication) }
            }
        }
    }
}
