// Shared plugin versions, declared once for the whole build.
//
// A subproject that writes `plugins { id 'x' version 'y' }` gets its **own classloader** for that
// plugin — Gradle says so explicitly, and warns that this happens "even if the versions are equal".
// Three subprojects each declared moddev 2.0.74, so three separate copies of the plugin class were
// loaded, and each one applied org.jetbrains.gradle.ext to the root project. The first registered the
// `settings` extension; the second was a different Class from a different loader, so Gradle did not
// recognise it as already applied and tried to register `settings` again:
//
//     Cannot add extension with name 'settings', as there is an extension already registered
//
// That only surfaced in IntelliJ, because ModDevGradle applies the IDEA plugin during a sync and not
// during a plain CLI build — which is why `./gradlew build` was green while project import failed.
//
// Declaring the versions here (and nowhere else) puts one copy of each plugin in the root
// classloader, shared by every subproject. Subprojects apply them without a version.
plugins {
    id 'org.jetbrains.kotlin.jvm' version '2.0.21' apply false
    id 'net.neoforged.moddev' version '2.0.74' apply false
    id 'com.gradleup.shadow' version '8.3.6' apply false
    // Modrinth / CurseForge / GitHub release publishing (`:mod:publishMods`). Pinned to 1.x: 2.x
    // requires Gradle 9 and this build is on 8.12.1.
    id 'me.modmuss50.mod-publish-plugin' version '1.1.0' apply false
}

subprojects {
    apply plugin: 'java-library'

    group = rootProject.group
    version = rootProject.version

    java {
        toolchain.languageVersion = JavaLanguageVersion.of(21)
    }

    repositories {
        mavenCentral()
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release.set(21)
    }
}

// ---- publishing ---------------------------------------------------------------------------------
// Shared with Create Linkworks via gradle/brassworks-maven.gradle (single source of truth). Only the
// two artifacts another project would ever depend on are published: `brassui-core` (the toolkit
// library) and `brassui` (the self-contained NeoForge mod). `:demo` and `:desktop` are development
// surfaces, not something to depend on, so they stay unpublished.
ext.brassworksMaven = [
    projects: [':core', ':mod'],
    artifactIds: [':core': 'brassui-core', ':mod': 'brassui'],
    pom: [
        url: 'https://github.com/Brassworks-smp/BrassUi',
        license: 'PolyForm Noncommercial License 1.0.0',
        licenseUrl: 'https://polyformproject.org/licenses/noncommercial/1.0.0',
        developerId: 'swzo',
        scmUrl: 'https://github.com/Brassworks-smp/BrassUi',
        scmConnection: 'scm:git:https://github.com/Brassworks-smp/BrassUi.git',
    ],
    projectPoms: [
        // The mod jar is self-contained at runtime: core + demo classes are folded in and
        // Elementa/UniversalCraft ride as jar-in-jar. Its POM deliberately carries Elementa +
        // UniversalCraft as compile-scope dependencies (so consumers compile against them without
        // adding anything), but KFF is pruned: it is a required *mod* (neoforge.mods.toml), not a
        // library - Kotlin consumers already declare it themselves and it lives on a repo we
        // shouldn't force them to add. `brassui-core` keeps its (honest) deps.
        ':mod': [
            description: 'brassui as a self-contained NeoForge mod, Elementa/UniversalCraft included.',
            pruneGroups: ['thedarkcolour'],
        ],
        ':core': [description: 'Elementa widget toolkit for Minecraft in the Brassworks launcher idiom.'],
    ],
]
apply from: rootProject.file('gradle/brassworks-maven.gradle')
