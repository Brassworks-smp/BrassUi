# Build the wiki and publish it to GitHub Pages (the gh-pages branch).
#
# The wiki depends on brassui-react via `file:../../BrassUiReact`, a private sibling repo, so building it
# in CI needs a token that can read that repo. Add a secret named BRASSUIREACT_TOKEN (a PAT, or a
# fine-grained token, with read access to Brassworks-smp/BrassUiReact — or salem-5/BrassUiReact while it
# lives there) and this rebuilds and redeploys on every change to the wiki or the versions it shows. If
# the secret is absent the build step fails fast with a clear message; the site can still be deployed by
# hand with `cd wiki && npm run gen && npm run build` and pushing wiki/dist.
name: Deploy Pages

on:
  push:
    branches: [ main ]
    paths:
      - "wiki/**"
      - "gradle.properties"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

# Read the secret once here so the steps below can be skipped (a green run) rather than failed when it
# is absent. The gh-pages branch just keeps whatever was last deployed until the token is added.
env:
  HAS_TOKEN: ${{ secrets.BRASSUIREACT_TOKEN != '' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Note when the token is missing
        if: env.HAS_TOKEN != 'true'
        run: echo "::notice::BRASSUIREACT_TOKEN is not set — skipping the wiki rebuild. Add a secret with read access to the private BrassUiReact repo to enable auto-deploy."

      - uses: actions/checkout@v4
        if: env.HAS_TOKEN == 'true'

      - uses: actions/setup-node@v4
        if: env.HAS_TOKEN == 'true'
        with:
          node-version: "20"

      - name: Fetch the private brassui-react dependency
        if: env.HAS_TOKEN == 'true'
        run: |
          git clone --depth 1 \
            "https://x-access-token:${{ secrets.BRASSUIREACT_TOKEN }}@github.com/salem-5/BrassUiReact.git" \
            "${{ github.workspace }}/../BrassUiReact"

      - name: Build brassui-react
        if: env.HAS_TOKEN == 'true'
        working-directory: ${{ github.workspace }}/../BrassUiReact
        run: |
          npm ci
          npm run build    # -> dist/ (index.js + index.d.ts), which its package.json points at.
                           # Its dist is gitignored, so the wiki can't resolve `brassui-react` until it exists.

      - name: Build the site
        if: env.HAS_TOKEN == 'true'
        working-directory: wiki
        run: |
          npm ci
          npm run gen      # regenerate widgets.ts + meta.ts from the current build
          npm run build    # -> wiki/dist

      - name: Publish to gh-pages
        if: env.HAS_TOKEN == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: wiki/dist
