# Build the wiki and publish it to GitHub Pages (the gh-pages branch).
#
# The wiki depends on brassui-react via `file:../../BrassUiReact` (a sibling checkout). BrassUiReact
# lives as a public repo in the Brassworks-smp org, so this workflow clones it with no credentials and
# rebuilds/redeploys the wiki on every change to the wiki or the versions it shows.
name: Deploy Pages

on:
  push:
    branches: [ main ]
    paths:
      - "wiki/**"
      - "gradle.properties"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Fetch the brassui-react dependency
        run: |
          git clone --depth 1 https://github.com/Brassworks-smp/BrassUiReact.git \
            "${{ github.workspace }}/../BrassUiReact"

      - name: Build brassui-react
        working-directory: ${{ github.workspace }}/../BrassUiReact
        run: |
          npm ci
          npm run build    # -> dist/ (index.js + index.d.ts), which its package.json points at.
                           # Its dist is gitignored, so the wiki can't resolve `brassui-react` until it exists.

      - name: Build the site
        working-directory: wiki
        run: |
          npm ci
          npm run gen      # regenerate widgets.ts + meta.ts from the current build
          npm run build    # -> wiki/dist

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: wiki/dist
