# Keep the Elementa version current.
#
# Elementa is published to Essential's maven as gg.essential:elementa, versioned by a build number that
# ticks up on every release. This job checks that maven's metadata once a day, and if a newer version is
# out it bumps `elementa_version` in gradle.properties and commits it. That commit lands on main, which
# is what the refresh-docs job watches, so the wiki's Gradle snippet follows Elementa without anyone
# touching a file. Node-only work, so it needs no secrets.
name: Update Elementa

on:
  schedule:
    - cron: "17 6 * * *"   # daily, off the hour
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for a newer Elementa
        id: check
        run: |
          latest=$(curl -sf --max-time 30 \
            "https://repo.essential.gg/repository/maven-public/gg/essential/elementa/maven-metadata.xml" \
            | sed -n 's:.*<latest>\(.*\)</latest>.*:\1:p' | head -n1)
          current=$(sed -n 's/^elementa_version=//p' gradle.properties)
          echo "latest=$latest"   >> "$GITHUB_OUTPUT"
          echo "current=$current" >> "$GITHUB_OUTPUT"
          if [ -n "$latest" ] && [ "$latest" != "$current" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump and commit
        if: steps.check.outputs.changed == 'true'
        run: |
          sed -i "s/^elementa_version=.*/elementa_version=${{ steps.check.outputs.latest }}/" gradle.properties
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "update elementa to ${{ steps.check.outputs.latest }}"
          git push
