# Release pipeline: build every supported loader/version pair, then publish to Modrinth,
# CurseForge, GitHub Releases and the Brassworks Maven. Triggered by a `v*` tag.
#
# Secrets to configure:
#   MODRINTH_TOKEN, CURSEFORGE_TOKEN            — API tokens (project IDs live in gradle.properties)
#   MODRINTH_PROJECT_ID                         — for the description sync step
#   BRASSWORKS_MAVEN_USER, BRASSWORKS_MAVEN_KEY — maven.opnsoc.org publishing credentials
name: Publish

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

env:
  # Read once here so publishMods' dryRun fallback works when a secret is absent.
  MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
  CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}

jobs:
  publish-mods:
    name: Publish ${{ matrix.loader }}-${{ matrix.mc }}
    strategy:
      fail-fast: false
      matrix:
        # One row per supported loader/version. The multiloader migration (Stonecutter) will grow
        # this list; each row runs the same build → publishMods flow.
        include:
          - loader: neoforge
            mc: 1.21.1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build --stacktrace

      - name: Publish to Modrinth, CurseForge and GitHub
        run: ./gradlew :mod:publishMods --stacktrace
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync Modrinth project description from MODRINTH.md
        if: secrets.MODRINTH_PROJECT_ID != ''
        env:
          MODRINTH_PROJECT_ID: ${{ secrets.MODRINTH_PROJECT_ID }}
        run: |
          jq -n --rawfile body MODRINTH.md '{description: $body}' \
            | curl -fsS -X PATCH "https://api.modrinth.com/v2/project/${MODRINTH_PROJECT_ID}" \
                -H "Authorization: ${MODRINTH_TOKEN}" \
                -H 'Content-Type: application/json' \
                --data-binary @-

  publish-maven:
    name: Publish to Maven
    needs: publish-mods
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Publish brassui + brassui-core to maven.opnsoc.org
        run: ./gradlew publish --stacktrace
        env:
          BRASSWORKS_MAVEN_USER: ${{ secrets.BRASSWORKS_MAVEN_USER }}
          BRASSWORKS_MAVEN_KEY: ${{ secrets.BRASSWORKS_MAVEN_KEY }}
