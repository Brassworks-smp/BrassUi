# Build and check on every push and pull request.
#
# The moddev plugin pulls Minecraft, NeoForge, Parchment and Elementa/UniversalCraft on first run, so
# the Gradle cache that setup-gradle keeps is what makes the second build minutes rather than the first.
name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Cancel an in-progress run when the same branch is pushed again — the older result is moot.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build --stacktrace
