// brassui (the mod): a self-contained NeoForge mod that ships the brassui Elementa toolkit and its
// /brassui showcase. It bundles Elementa + UniversalCraft as jar-in-jar game libraries and declares
// Kotlin-For-Forge, so any host mod only has to jar-in-jar THIS one to get a working in-game UI.
//
// How a host mod consumes it (see the wiki's Getting Started page for the full snippet):
//
//     implementation(jarJar("net.swzo.brass:brassui:<version>") {})
//
// That works because the published POM exposes Elementa + UniversalCraft as compile-scope
// dependencies (so the consumer's code can see BrassScreen's Elementa base classes without listing
// them) while the jar itself carries Elementa/UC jar-in-jar (so nothing extra is needed at runtime).
//
// Shared versions come from the root gradle.properties; the root subprojects{} block supplies
// group/version + the Java 21 toolchain. This is what gets published as `net.swzo.brass:brassui`, and
// what a host mod jar-in-jars.
//
// ### Why the toolkit's classes are FOLDED in, not jar-in-jar'd
//
// The toolkit library (:core) is a plain LIBRARY. In a packaged jar-in-jar launch FML puts each
// embedded jar in its own JPMS module: a LIBRARY module cannot read a GAMELIBRARY module (Elementa /
// UniversalCraft, which sit in the game layer so they can reach net.minecraft), so
// `BrassScreen extends WindowScreen` would throw `IllegalAccessError: ... does not read module elementa`.
// Folding the library's compiled classes straight into THIS mod jar puts them in the mod module, which
// reads the elementa/universalcraft gamelibraries the same way it reads minecraft. Elementa/UC ARE
// jar-in-jar'd (as-is), because Essential ships them as GAMELIBRARY and that is what lets UniversalCraft
// read `minecraft`.
plugins {
    id 'org.jetbrains.kotlin.jvm'
    id 'net.neoforged.moddev'
    id 'me.modmuss50.mod-publish-plugin'
}

// `brassui-<version>.jar` on disk — matches the maven coordinate and what Modrinth/CurseForge show.
base {
    archivesName = 'brassui'
}

kotlin {
    jvmToolchain(21)
}

// The library subproject must be evaluated first so its sourceSets exist for the mods{} merge and the
// jar fold below.
evaluationDependsOn(':core')
evaluationDependsOn(':demo')

repositories {
    // Elementa + UniversalCraft.
    maven {
        url = 'https://repo.essential.gg/repository/maven-public'
        content { includeGroup 'gg.essential' }
    }
    // Kotlin For Forge — the Kotlin runtime provider for NeoForge.
    maven {
        url = 'https://thedarkcolour.github.io/KotlinForForge/'
        content { includeGroup 'thedarkcolour' }
    }
}

neoForge {
    version = project.neo_version
    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }
    mods {
        brassui {
            sourceSet sourceSets.main
            // Dev-run only: associate the toolkit library's classes with this mod so they load in the
            // same module (otherwise a dev run can't load e.g. BrassScreen: NoClassDefFoundError at
            // construction). Packaging is handled by the jar fold below, not this.
            sourceSet project(':core').sourceSets.main
            sourceSet project(':demo').sourceSets.main
        }
    }
    runs {
        // `/brassui` is testable straight from this project: ./gradlew :mod:runClient
        client {
            client()
        }
        // Headless dedicated-server boot for the CI smoke test: ./gradlew :mod:runServer.
        server {
            server()
        }
    }
}

dependencies {
    // The toolkit library and gallery, for compilation only. Their classes are FOLDED into the jar
    // below (see the header), so they must not appear in the published POM — a consumer depending on
    // `brassui` would otherwise have to exclude them (and `demo` isn't even published).
    compileOnly project(':core')
    compileOnly project(':demo')

    // Elementa/UniversalCraft: `api` so the published POM exposes them as compile-scope dependencies
    // and a consumer's `implementation("net.swzo.brass:brassui")` pulls them without any extra lines.
    // transitive=false keeps UniversalCraft's own transitive deps out of resolution (moddev already
    // provides the game, and the consumer's build gets nothing but the two jars — elementa's POM is
    // empty and UC's only extra is a kotlin-stdlib that Kotlin mods already have).
    api("gg.essential:elementa:${project.elementa_version}") { transitive = false }
    api("gg.essential:universalcraft-1.21-neoforge:${project.universalcraft_version}") { transitive = false }

    // Kotlin For Forge provides the Kotlin runtime AND the FML wiring that makes kotlin.* readable to
    // this mod's module. runtimeOnly: we reference none of its classes, and keeping it off the compile
    // classpath avoids a Kotlin-metadata version clash (KFF 5.12 is built with a newer Kotlin than our
    // compiler). NOT bundled, and NOT in the published POM — KFF is a required mod (declared in the
    // toml) that every Kotlin consumer already declares itself; publishing it would force consumers
    // to add KFF's maven. A client running this jar needs KFF installed.
    runtimeOnly "thedarkcolour:kotlinforforge-neoforge:${project.kff_version}"

    // Bundle Elementa + UniversalCraft AS-IS (Essential ships them with FMLModType: GAMELIBRARY, which
    // is what lets UniversalCraft read the minecraft module). The base game ships neither.
    jarJar("gg.essential:elementa:${project.elementa_version}") { transitive = false }
    jarJar("gg.essential:universalcraft-1.21-neoforge:${project.universalcraft_version}") { transitive = false }

    // Bundle MongoDB's BSON so a consumer's runtime needs nothing extra: the toolkit's folded classes
    // serialise brassnet values and node graphs through it. Purely a runtime library (no game types,
    // no mod metadata), so it rides as an ordinary jar-in-jar next to Elementa/UniversalCraft.
    jarJar("org.mongodb:bson:${project.bson_version}") { transitive = false }

    // Same ride for the Ultralight HTML engine (BrassHtml): pure-JVM bindings, jar-in-jar'd, with the
    // C++ engine natives downloaded at runtime on first use. LGPL-3.0 — see core/build.gradle.
    jarJar("com.labymedia:ultralight-java-base:${project.ultralight_java_version}") { transitive = false }
    jarJar("com.labymedia:ultralight-java-databind:${project.ultralight_java_version}") { transitive = false }
    jarJar("com.labymedia:ultralight-java-gpu:${project.ultralight_java_version}") { transitive = false }
}

// The mod's version lives once in root gradle.properties — feed it into the mods.toml so the toml
// can't drift from what the jar/maven coordinate say.
tasks.named('processResources') {
    inputs.property('version', project.version)
    filesMatching('META-INF/neoforge.mods.toml') {
        expand(version: project.version)
    }
}

// Fold the toolkit library's compiled classes (and its resources — icons.png, syntax_rules.json) into
// this mod jar rather than jar-in-jar'ing it as a separate LIBRARY module. See the header for why.
tasks.named('jar') {
    from(project(':core').sourceSets.main.output)
    from(project(':demo').sourceSets.main.output)
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

// The mod POM is the consumer contract (Elementa/UC compile deps, KFF runtime) and must be the only
// metadata consumers see — Gradle module metadata could smuggle in the jarJar/folded internals.
tasks.withType(GenerateModuleMetadata).configureEach { enabled = false }

// ---- Modrinth / CurseForge / GitHub releases ----------------------------------------------------
//
// `./gradlew :mod:publishMods` uploads the mod jar to every configured destination in one run.
// Project IDs come from gradle properties (`modrinth.projectId`, `curseforge.projectId`); tokens come
// from environment variables (CI secrets). When a token is missing the destination falls back to
// `dryRun`, which stages the release under build/ instead of hitting the API, so a local build never
// accidentally publishes.
publishMods {
    file = tasks.named('jar').flatMap { it.archiveFile }
    changelog = providers.gradleProperty('changelog').getOrElse('See the GitHub releases page for the changelog.')
    displayName = "BrassUi ${project.version}"
    type = STABLE
    modLoaders.add('neoforge')

    curseforge {
        projectId = providers.gradleProperty('curseforge.projectId').getOrElse('000000')
        projectSlug = providers.gradleProperty('curseforge.projectSlug').getOrElse('brassui')
        accessToken = providers.environmentVariable('CURSEFORGE_TOKEN')
        minecraftVersions.add(project.minecraft_version)
        dryRun = providers.environmentVariable('CURSEFORGE_TOKEN').getOrNull() == null
    }

    modrinth {
        projectId = providers.gradleProperty('modrinth.projectId').getOrElse('00000000')
        accessToken = providers.environmentVariable('MODRINTH_TOKEN')
        minecraftVersions.add(project.minecraft_version)
        dryRun = providers.environmentVariable('MODRINTH_TOKEN').getOrNull() == null
        // brassui declares Kotlin-For-Forge as a runtime requirement (see neoforge.mods.toml).
        requires { slug = 'kotlinforforge' }
    }

    github {
        repository = 'Brassworks-smp/BrassUi'
        accessToken = providers.environmentVariable('GITHUB_TOKEN')
        commitish = 'main'
        dryRun = providers.environmentVariable('GITHUB_TOKEN').getOrNull() == null
    }
}
