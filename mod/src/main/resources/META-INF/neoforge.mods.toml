modLoader = "javafml"
loaderVersion = "[4,)"
license = "GPL-3.0"
issueTrackerURL = "https://brassworks.opnsoc.org"

[[mods]]
modId = "brassui"
version = "${version}"
# Cosmetic client toolkit — never rejects a server for a version mismatch.
displayTest = "IGNORE_ALL_VERSION"
displayName = "brassui"
displayURL = "https://brassworks.opnsoc.org"
credits = "swzo"
authors = "swzo"
description = '''In-game Elementa UI toolkit (the BrassWorks launcher look) plus its /brassui showcase.'''

[[dependencies.brassui]]
modId = "neoforge"
type = "required"
versionRange = "[21.1.128,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.brassui]]
modId = "minecraft"
type = "required"
versionRange = "[1.21,1.21.3)"
ordering = "NONE"
side = "BOTH"

# Kotlin For Forge — the Kotlin runtime, and the FML module wiring that makes kotlin.* readable to this
# mod. Deliberately NOT bundled: KFF is a library mod that has to own that module wiring, and
# jar-in-jar'ing a bare kotlin-stdlib without it leaves kotlin.enums unreadable.
#
# BOTH sides: the networking module (BrassNetNeoForgeEvents, NeoForgeBrassNet) is deliberately not
# Dist-gated so the same single jar registers payloads, discovers @BrassActionSet objects and runs
# action handlers on a dedicated server as well as on a client. That means the server now loads Kotlin
# classes, so the runtime has to be present there too.
[[dependencies.brassui]]
modId = "kotlinforforge"
type = "required"
versionRange = "[5.12.0,6.0.0)"
ordering = "NONE"
side = "BOTH"
